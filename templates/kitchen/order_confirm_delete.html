{% extends "base.html" %}

{% block content %}
  <h1>Delete Order</h1>
  <p>Are you sure you want to delete order #{{ object.id }} ({{ object.dish.name }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'kitchen:order-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
