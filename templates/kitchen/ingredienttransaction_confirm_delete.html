{% extends 'layouts/base-presentation.html' %}

{% block content %}
<div class="container mt-8">
  <h1>Delete Transaction</h1>
    <p>Are you sure you want to delete this transaction for "{{ object.ingredient.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Confirm Delete" class="btn btn-danger">
    <a href="{% url 'kitchen:ingredienttransaction-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
