{% extends "base.html" %}
{% block content %}
  <h1>Dish Types List</h1>

  {% if dish_type_list %}
    <table>
      <thead>
        <tr>
          <th>Name</th>
        </tr>
      </thead>
      <tbody>
        {% for dish in dish_type_list %}
          <tr>
            <td>{{ dish.name }}</td>
            <td>{{ dish.country }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No dish_type found.</p>
  {% endif %}
{% endblock %}
